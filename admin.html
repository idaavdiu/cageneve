<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#C0392B;--black:#1a1a1a;--white:#FAFAF8;--gray:#6b6b6b;--light:#F4F2EE;--border:#e0ddd8}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--light);color:var(--black);min-height:100vh}
header{background:var(--black);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}
header h1 span{color:var(--red)}
header .header-right{display:flex;align-items:center;gap:.75rem}
#logoutBtn{background:none;border:1px solid #555;color:#ccc;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px}
#logoutBtn:hover{border-color:#999;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:1.5rem}
.hidden{display:none !important}

/* language switch */
.lang-switch{display:flex;background:#f0ede8;border-radius:4px;padding:3px;gap:2px}
header .lang-switch{background:#2a2a2a}
.lang-btn{font-size:11px;font-weight:500;padding:5px 10px;border:none;cursor:pointer;border-radius:3px;background:transparent;color:var(--gray)}
header .lang-btn{color:#aaa}
.lang-btn.active{background:var(--red);color:#fff}

/* login */
#loginScreen{max-width:360px;margin:3rem auto 0;background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#loginScreen h2{margin-bottom:1rem;font-size:18px}
#loginScreen input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px;margin-bottom:.75rem}
#loginScreen button{width:100%;padding:10px;background:var(--red);color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer}
#loginScreen button:disabled{opacity:.6;cursor:default}
#loginError{color:var(--red);font-size:13px;margin-bottom:.75rem;min-height:1em}
.captcha-q{display:block;font-size:14px;margin-bottom:.5rem}
.captcha-q strong{font-size:18px;letter-spacing:.04em;white-space:nowrap}
.captcha-new{display:inline-block;margin-top:.6rem;font-size:12px;color:var(--gray)}
.login-lang-wrap{max-width:360px;margin:1.5rem auto 0;display:flex;justify-content:center}

/* tabs */
.tabs{display:flex;gap:.5rem;margin-bottom:1.25rem}
.tab-btn{padding:8px 16px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:14px}
.tab-btn.active{background:var(--black);color:#fff;border-color:var(--black)}

.card{background:#fff;border-radius:8px;padding:1.25rem;margin-bottom:1.25rem;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.row label{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
.row .field{flex:1;min-width:150px}
input[type=text],input[type=date],input[type=file],input[type=url],input[type=password]{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:14px
}
.btn{padding:8px 16px;background:var(--black);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn-red{background:var(--red)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--black)}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red)}
.status-msg{font-size:13px;margin-top:.4rem;min-height:1.1em}
.status-msg.ok{color:#2e7d32}
.status-msg.err{color:var(--red)}

/* lists */
.item{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item img{width:48px;height:48px;object-fit:cover;border-radius:4px;flex-shrink:0;background:#eee}
.item .icon{width:48px;height:48px;border-radius:4px;flex-shrink:0;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:20px}
.item .info{flex:1;min-width:0}
.item .title{font-size:14px;font-weight:500}
.item .sub{font-size:12px;color:var(--gray)}
.item .actions{display:flex;gap:.4rem;flex-shrink:0}
.item .actions button{padding:5px 10px;font-size:12px}
.drag-handle{cursor:grab;color:#aaa;font-size:20px;line-height:1;padding:.5rem .25rem;user-select:none;touch-action:none;flex-shrink:0}
.drag-handle:hover{color:var(--black)}
.item.drag-ghost{opacity:.35;background:var(--light)}
.drag-hint{font-size:12px;color:var(--gray);margin:-.6rem 0 .6rem}

.year-box{margin-bottom:1rem}
.year-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.year-head h4{font-size:15px}
.year-head .year-sub{font-size:12px;color:var(--gray);margin-left:.5rem}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal{background:#fff;border-radius:8px;padding:1.25rem;max-width:560px;width:100%;max-height:90vh;overflow:auto}
textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:90px}
.modal label{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
.modal .row{display:block}
.modal .check{display:flex;align-items:center;gap:.4rem;font-size:13px;color:var(--black)}
.modal h3{margin-bottom:1rem;font-size:15px}
.modal .row{margin-bottom:.75rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
</style>

// Fetch the client token through our own api() helper so the server's real
// error message is shown instead of the SDK's generic "Failed to retrieve the client token".
async function uploadFile(pathname, file) {
  const res = await api('/api/upload', {
    jsonBody: { type: 'blob.generate-client-token', payload: { pathname, clientPayload: null, multipart: false } }
  });
  return put(pathname, file, { access: 'public', token: res.clientToken, contentType: file.type || undefined });
}

const LANG_KEY = 'cageneve_admin_lang';
let lang = localStorage.getItem(LANG_KEY) || 'de';
if (!STRINGS[lang]) lang = 'de';

function t(key, vars) {
  let s = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.de[key] || key;
  if (vars) Object.keys(vars).forEach(function (k) { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}

function applyI18n() {
  document.title = t('pageTitle');
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === lang); });
  // re-render dynamic lists (if already loaded) so their embedded labels update too
  if (!app.classList.contains('hidden')) { loadFlyers(); loadDocs(); }
}

function setLang(l) {
  lang = STRINGS[l] ? l : 'de';
  localStorage.setItem(LANG_KEY, lang);
  applyI18n();
}

document.querySelectorAll('.lang-btn').forEach(function (btn) {
  btn.addEventListener('click', function () { setLang(btn.dataset.lang); });
});

// ---------------- API HELPER ----------------
function api(path, options) {
  options = options || {};
  options.headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  options.credentials = 'same-origin';
  if (options.jsonBody) {
    options.body = JSON.stringify(options.jsonBody);
    options.method = options.method || 'POST';
  }
  return fetch(path, options).then(async function (res) {
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    return data;
  });
}

function setStatus(el, msg, ok) {
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
}

// ---------------- CAPTCHA ----------------
// Step 1 of the login: solve a small math question (checked by the server),
// which yields a short-lived pass that /api/login requires.
let captchaChallenge = null;
let captchaPass = null;

function showCaptchaStep() {
  captchaPass = null;
  document.getElementById('passwordStep').classList.add('hidden');
  document.getElementById('captchaStep').classList.remove('hidden');
  document.getElementById('passwordInput').value = '';
  loadCaptcha();
}

function loadCaptcha() {
  const q = document.getElementById('captchaQuestion');
  const input = document.getElementById('captchaInput');
  q.textContent = '…';
  input.value = '';
  api('/api/captcha').then(function (c) {
    captchaChallenge = c.challenge;
    q.textContent = c.question;
    input.focus();
  }).catch(function (e) { document.getElementById('loginError').textContent = e.message; });
}

function submitCaptcha() {
  const btn = document.getElementById('captchaBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  btn.disabled = true;
  api('/api/captcha', { jsonBody: { challenge: captchaChallenge, answer: document.getElementById('captchaInput').value } })
    .then(function (r) {
      captchaPass = r.pass;
      document.getElementById('captchaStep').classList.add('hidden');
      document.getElementById('passwordStep').classList.remove('hidden');
      document.getElementById('passwordInput').focus();
    })
    .catch(function (e) { err.textContent = e.message; loadCaptcha(); })
    .finally(function () { btn.disabled = false; });
}

document.getElementById('captchaBtn').addEventListener('click', submitCaptcha);
document.getElementById('captchaInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitCaptcha();
});
document.getElementById('captchaNew').addEventListener('click', function (e) {
  e.preventDefault();
  loadCaptcha();
});

// ---------------- LOGIN ----------------
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passwordInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  const pw = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  btn.disabled = true;
  api('/api/login', { jsonBody: { password: pw, captchaPass: captchaPass } })
    .then(function () {
      loginScreen.classList.add('hidden');
      document.querySelector('.login-lang-wrap').classList.add('hidden');
      app.classList.remove('hidden');
      loadFlyers();
      loadDocs();
      loadBoard();
    })
    .catch(function (e) { showCaptchaStep(); err.textContent = e.message; })
    .finally(function () { btn.disabled = false; });
}

document.getElementById('logoutBtn').addEventListener('click', function () {
  api('/api/logout', { method: 'POST' }).finally(function () {
    app.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    document.querySelector('.login-lang-wrap').classList.remove('hidden');
    showCaptchaStep();
  });
});

// ---------------- MODAL HELPER ----------------
function openModal(title, fields, onSave) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = '<h3>' + escapeHtml(title) + '</h3>' +
    fields.map(function (f) {
      if (f.type === 'textarea') {
        return '<div class="row"><label>' + escapeHtml(f.label) + '</label><textarea rows="6" data-key="' + f.key + '">' + escapeHtml(f.value || '') + '</textarea></div>';
      }
      if (f.type === 'file') {
        return '<div class="row"><label>' + escapeHtml(f.label) + '</label><input type="file" accept="' + (f.accept || '') + '" data-key="' + f.key + '"></div>';
      }
      if (f.type === 'checkbox') {
        return '<div class="row"><label class="check"><input type="checkbox" data-key="' + f.key + '"> ' + escapeHtml(f.label) + '</label></div>';
      }
      return '<div class="row"><label>' + escapeHtml(f.label) + '</label><input type="' + (f.type || 'text') + '" data-key="' + f.key + '" value="' + escapeHtml(f.value || '') + '"></div>';
    }).join('') +
    '<div class="modal-actions"><button class="btn btn-ghost" id="modalCancel">' + escapeHtml(t('btnCancel')) + '</button><button class="btn btn-red" id="modalSave">' + escapeHtml(t('btnSave')) + '</button></div>' +
    '<div class="status-msg" id="modalStatus"></div>';
  overlay.innerHTML = '';
  overlay.appendChild(modal);
  overlay.classList.remove('hidden');

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', function () {
    const values = {};
    modal.querySelectorAll('[data-key]').forEach(function (inp) {
      values[inp.dataset.key] = inp.type === 'file' ? (inp.files[0] || null) : inp.type === 'checkbox' ? inp.checked : inp.value;
    });
    const statusEl = document.getElementById('modalStatus');
    const saveBtn = document.getElementById('modalSave');
    saveBtn.disabled = true;
    setStatus(statusEl, t('savingStatus'), true);
    Promise.resolve(onSave(values))
      .then(closeModal)
      .catch(function (e) { setStatus(statusEl, e.message, false); saveBtn.disabled = false; });
  });
}
function closeModal() {
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
}

// ---------------- DRAG & DROP ORDER ----------------
// Makes the .item rows in `listEl` draggable by their handle and saves the
// new order right away; on failure the list is reloaded from the server.
function makeSortable(listEl, statusEl, save, reload) {
  if (!listEl || listEl.querySelectorAll('.item').length < 2) return;
  Sortable.create(listEl, {
    handle: '.drag-handle',
    draggable: '.item',
    animation: 150,
    ghostClass: 'drag-ghost',
    onEnd: function (evt) {
      if (evt.oldIndex === evt.newIndex) return;
      const ids = Array.from(listEl.querySelectorAll('.item')).map(el => el.dataset.id);
      setStatus(statusEl, t('savingOrder'), true);
      save(ids)
        .then(function () { setStatus(statusEl, t('orderSaved'), true); })
        .catch(function (e) { reload(); setStatus(statusEl, e.message, false); });
    }
  });
}

// ---------------- FLYERS ----------------
function loadFlyers() {
  const list = document.getElementById('flyerList');
  list.textContent = t('loading');
  api('/api/events').then(function (events) {
    if (!events.length) { list.innerHTML = '<p style="color:var(--gray);font-size:13px">' + escapeHtml(t('noFlyers')) + '</p>'; return; }
    list.innerHTML = events.map(function (e) {
      return '<div class="item" data-id="' + e.id + '">' +
        '<span class="drag-handle" aria-hidden="true">⠿</span>' +
        '<img src="' + escapeHtml(hrefFor(e.image)) + '" alt="">' +
        '<div class="info"><div class="title">' + escapeHtml(e.title_sq) + '</div>' +
        '<div class="sub">' + escapeHtml(e.date_display_sq || e.date) + ' · ' + escapeHtml(e.title_fr) + '</div></div>' +
        '<div class="actions"><button class="btn btn-ghost edit-flyer">' + escapeHtml(t('btnEdit')) + '</button><button class="btn btn-danger del-flyer">' + escapeHtml(t('btnDelete')) + '</button></div>' +
        '</div>';
    }).join('');
    makeSortable(list, document.getElementById('flyerOrderStatus'), function (ids) {
      return api('/api/events', { method: 'PATCH', jsonBody: { ids: ids } });
    }, loadFlyers);
    list.querySelectorAll('.edit-flyer').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.item').dataset.id;
        const ev = events.find(x => x.id === id);
        openModal(t('editFlyerTitle'), [
          { key: 'date', label: t('labelDate'), type: 'date', value: ev.date },
          { key: 'title_sq', label: t('labelTitleSq'), value: ev.title_sq },
          { key: 'title_fr', label: t('labelTitleFr'), value: ev.title_fr },
          { key: 'video_url', label: t('labelVideoOptionalShort'), value: ev.video_url || '' }
        ], function (values) {
          return api('/api/events', { method: 'PUT', jsonBody: Object.assign({ id: id }, values, { date_display_sq: null, date_display_fr: null }) })
            .then(loadFlyers);
        });
      });
    });
    list.querySelectorAll('.del-flyer').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.item').dataset.id;
        if (!confirm(t('confirmDeleteFlyer'))) return;
        api('/api/events?id=' + encodeURIComponent(id), { method: 'DELETE' }).then(loadFlyers);
      });
    });
  }).catch(function (e) { list.textContent = t('errorPrefix') + e.message; });
}

document.getElementById('newFlyerForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const statusEl = document.getElementById('flyerFormStatus');
  const submitBtn = e.target.querySelector('button[type=submit]');
  const file = document.getElementById('flyerFile').files[0];
  const date = document.getElementById('flyerDate').value;
  const title_sq = document.getElementById('flyerTitleSq').value.trim();
  const title_fr = document.getElementById('flyerTitleFr').value.trim();
  const video_url = document.getElementById('flyerVideo').value.trim() || null;
  if (!file) { setStatus(statusEl, t('errorPickImage'), false); return; }

  submitBtn.disabled = true;
  setStatus(statusEl, t('uploadingImage'), true);
  uploadFile('flyers/' + file.name, file)
    .then(function (blob) {
      setStatus(statusEl, t('saving'), true);
      return api('/api/events', { jsonBody: { image: blob.url, date, title_sq, title_fr, video_url } });
    })
    .then(function () {
      setStatus(statusEl, t('flyerUploaded'), true);
      e.target.reset();
      loadFlyers();
    })
    .catch(function (err) { setStatus(statusEl, err.message, false); })
    .finally(function () { submitBtn.disabled = false; });
});

// ---------------- BOARD (KRYESIA) ----------------
function loadBoard() {
  const list = document.getElementById('boardList');
  list.textContent = t('loading');
  api('/api/board').then(function (members) {
    if (!members.length) { list.innerHTML = '<p style="color:var(--gray);font-size:13px">' + escapeHtml(t('noMembers')) + '</p>'; return; }
    list.innerHTML = members.map(function (m) {
      return '<div class="item" data-id="' + m.id + '">' +
        '<span class="drag-handle" aria-hidden="true">⠿</span>' +
        (m.photo ? '<img src="' + escapeHtml(hrefFor(m.photo)) + '" alt="" style="object-position:' + escapeHtml(m.photo_position || 'top') + '">' : '<div class="icon">👤</div>') +
        '<div class="info"><div class="title">' + escapeHtml(m.name) + '</div>' +
        '<div class="sub">' + escapeHtml(m.role_sq) + ' · ' + escapeHtml(m.role_fr) + '</div></div>' +
        '<div class="actions"><button class="btn btn-ghost edit-member">' + escapeHtml(t('btnEdit')) + '</button><button class="btn btn-danger del-member">' + escapeHtml(t('btnDelete')) + '</button></div>' +
        '</div>';
    }).join('');
    makeSortable(list, document.getElementById('boardOrderStatus'), function (ids) {
      return api('/api/board', { method: 'PATCH', jsonBody: { ids: ids } });
    }, loadBoard);
    list.querySelectorAll('.edit-member').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.item').dataset.id;
        const m = members.find(x => x.id === id);
        const fields = [
          { key: 'name', label: t('labelName'), value: m.name },
          { key: 'role_sq', label: t('labelRoleSq'), value: m.role_sq },
          { key: 'role_fr', label: t('labelRoleFr'), value: m.role_fr },
          { key: 'photoFile', label: m.photo ? t('labelNewPhoto') : t('labelPhotoOptional'), type: 'file', accept: 'image/*' }
        ];
        if (m.photo) fields.push({ key: 'removePhoto', label: t('btnRemovePhoto'), type: 'checkbox' });
        fields.push(
          { key: 'bio_sq', label: t('labelBioSq'), type: 'textarea', value: m.bio_sq },
          { key: 'bio_fr', label: t('labelBioFr'), type: 'textarea', value: m.bio_fr }
        );
        openModal(t('editMemberTitle'), fields, function (values) {
          const body = { id: id, name: values.name.trim(), role_sq: values.role_sq.trim(), role_fr: values.role_fr.trim(), bio_sq: values.bio_sq.trim(), bio_fr: values.bio_fr.trim() };
          let photoStep = Promise.resolve();
          if (values.photoFile) {
            photoStep = uploadFile('board/' + values.photoFile.name, values.photoFile)
              .then(function (blob) { body.photo = blob.url; body.photo_position = null; });
          } else if (values.removePhoto) {
            body.photo = null; body.photo_position = null;
          }
          return photoStep
            .then(function () { return api('/api/board', { method: 'PUT', jsonBody: body }); })
            .then(loadBoard);
        });
      });
    });
    list.querySelectorAll('.del-member').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.item').dataset.id;
        if (!confirm(t('confirmDeleteMember'))) return;
        api('/api/board?id=' + encodeURIComponent(id), { method: 'DELETE' }).then(loadBoard);
      });
    });
  }).catch(function (e) { list.textContent = t('errorPrefix') + e.message; });
}

document.getElementById('newMemberForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const statusEl = document.getElementById('memberFormStatus');
  const submitBtn = e.target.querySelector('button[type=submit]');
  const file = document.getElementById('memberPhoto').files[0];
  const body = {
    name: document.getElementById('memberName').value.trim(),
    role_sq: document.getElementById('memberRoleSq').value.trim(),
    role_fr: document.getElementById('memberRoleFr').value.trim(),
    bio_sq: document.getElementById('memberBioSq').value.trim(),
    bio_fr: document.getElementById('memberBioFr').value.trim()
  };

  submitBtn.disabled = true;
  let photoStep = Promise.resolve();
  if (file) {
    setStatus(statusEl, t('uploadingImage'), true);
    photoStep = uploadFile('board/' + file.name, file).then(function (blob) { body.photo = blob.url; });
  }
  photoStep
    .then(function () {
      setStatus(statusEl, t('saving'), true);
      return api('/api/board', { jsonBody: body });
    })
    .then(function () {
      setStatus(statusEl, t('memberAdded'), true);
      e.target.reset();
      loadBoard();
    })
    .catch(function (err) { setStatus(statusEl, err.message, false); })
    .finally(function () { submitBtn.disabled = false; });
});

// ---------------- DOCUMENTS ----------------
function loadDocs() {
  const container = document.getElementById('docYears');
  container.textContent = t('loading');
  api('/api/documents').then(function (years) {
    years.sort(function (a, b) { return b.year.localeCompare(a.year); });
    if (!years.length) { container.innerHTML = '<p style="color:var(--gray);font-size:13px">' + escapeHtml(t('noYearBoxes')) + '</p>'; return; }
    container.innerHTML = years.map(function (y) {
      const docsHtml = y.docs.map(function (d) {
        return '<div class="item" data-year="' + y.year + '" data-id="' + d.id + '">' +
          '<span class="drag-handle" aria-hidden="true">⠿</span>' +
          '<div class="icon">📄</div>' +
          '<div class="info"><div class="title">' + escapeHtml(d.title_sq) + '</div><div class="sub">' + escapeHtml(d.title_fr) + '</div></div>' +
          '<div class="actions"><button class="btn btn-ghost edit-doc">' + escapeHtml(t('btnEdit')) + '</button><button class="btn btn-danger del-doc">' + escapeHtml(t('btnDelete')) + '</button></div>' +
          '</div>';
      }).join('') || '<p style="color:var(--gray);font-size:13px;padding:.4rem 0">' + escapeHtml(t('noDocsInYear')) + '</p>';

      return '<div class="card year-box" data-year="' + y.year + '">' +
        '<div class="year-head"><h4>' + escapeHtml(y.year) + '<span class="year-sub">' + escapeHtml(y.subtitle_sq) + '</span></h4>' +
        '<button class="btn-danger btn del-year" style="padding:4px 10px;font-size:11px">' + escapeHtml(t('btnDeleteYear')) + '</button></div>' +
        (y.docs.length > 1 ? '<p class="drag-hint" style="margin:0 0 .4rem">' + escapeHtml(t('dragHint')) + '</p>' : '') +
        '<div class="status-msg doc-order-status"></div>' +
        '<div class="doc-list">' + docsHtml + '</div>' +
        '<form class="add-doc-form" style="margin-top:.75rem;border-top:1px solid var(--border);padding-top:.75rem">' +
        '<div class="row"><div class="field"><label>' + escapeHtml(t('labelDocPdf')) + '</label><input type="file" class="doc-file" accept="application/pdf" required></div></div>' +
        '<div class="row"><div class="field"><label>' + escapeHtml(t('labelTitleSq')) + '</label><input type="text" class="doc-title-sq" required></div>' +
        '<div class="field"><label>' + escapeHtml(t('labelTitleFr')) + '</label><input type="text" class="doc-title-fr" required></div></div>' +
        '<button type="submit" class="btn btn-red">' + escapeHtml(t('btnUploadDoc')) + '</button>' +
        '<div class="status-msg doc-form-status"></div>' +
        '</form>' +
        '</div>';
    }).join('');

    container.querySelectorAll('.year-box').forEach(function (box) {
      const year = box.dataset.year;
      makeSortable(box.querySelector('.doc-list'), box.querySelector('.doc-order-status'), function (ids) {
        return api('/api/documents', { method: 'PATCH', jsonBody: { year: year, ids: ids } });
      }, loadDocs);
    });
    container.querySelectorAll('.edit-doc').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const item = btn.closest('.item');
        const year = item.dataset.year, id = item.dataset.id;
        const yearObj = years.find(y => y.year === year);
        const doc = yearObj.docs.find(d => d.id === id);
        openModal(t('editDocTitle'), [
          { key: 'title_sq', label: t('labelTitleSq'), value: doc.title_sq },
          { key: 'title_fr', label: t('labelTitleFr'), value: doc.title_fr }
        ], function (values) {
          return api('/api/documents', { method: 'PUT', jsonBody: Object.assign({ year: year, id: id }, values) }).then(loadDocs);
        });
      });
    });
    container.querySelectorAll('.del-doc').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const item = btn.closest('.item');
        if (!confirm(t('confirmDeleteDoc'))) return;
        api('/api/documents?year=' + encodeURIComponent(item.dataset.year) + '&id=' + encodeURIComponent(item.dataset.id), { method: 'DELETE' }).then(loadDocs);
      });
    });
    container.querySelectorAll('.del-year').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const year = btn.closest('.year-box').dataset.year;
        if (!confirm(t('confirmDeleteYear', { year: year }))) return;
        api('/api/documents?year=' + encodeURIComponent(year) + '&deleteYear=true', { method: 'DELETE' })
          .then(loadDocs)
          .catch(function (e) { alert(e.message); });
      });
    });
    container.querySelectorAll('.add-doc-form').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const year = form.closest('.year-box').dataset.year;
        const statusEl = form.querySelector('.doc-form-status');
        const submitBtn = form.querySelector('button[type=submit]');
        const file = form.querySelector('.doc-file').files[0];
        const title_sq = form.querySelector('.doc-title-sq').value.trim();
        const title_fr = form.querySelector('.doc-title-fr').value.trim();
        if (!file) { setStatus(statusEl, t('errorPickFile'), false); return; }

        submitBtn.disabled = true;
        setStatus(statusEl, t('uploadingFile'), true);
        uploadFile('documents/' + year + '/' + file.name, file)
          .then(function (blob) {
            setStatus(statusEl, t('saving'), true);
            return api('/api/documents', { jsonBody: { action: 'add-doc', year, file: blob.url, title_sq, title_fr } });
          })
          .then(function () {
            setStatus(statusEl, t('docUploaded'), true);
            loadDocs();
          })
          .catch(function (err) { setStatus(statusEl, err.message, false); submitBtn.disabled = false; });
      });
    });
  }).catch(function (e) { container.textContent = t('errorPrefix') + e.message; });
}

document.getElementById('newYearForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const statusEl = document.getElementById('yearFormStatus');
  const year = document.getElementById('yearInput').value.trim();
  api('/api/documents', { jsonBody: { action: 'create-year', year } })
    .then(function () {
      setStatus(statusEl, t('yearCreated'), true);
      document.getElementById('yearInput').value = '';
      loadDocs();
    })
    .catch(function (err) { setStatus(statusEl, err.message, false); });
});

function hrefFor(path) {
  return /^https?:\/\//.test(path) ? path : encodeURI(path);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

applyI18n();

// If already logged in (valid cookie), skip the login screen.
api('/api/events').then(function () {
  loginScreen.classList.add('hidden');
  document.querySelector('.login-lang-wrap').classList.add('hidden');
  app.classList.remove('hidden');
  loadFlyers();
  loadDocs();
  loadBoard();
}).catch(function () { showCaptchaStep(); /* stay on login screen */ });
